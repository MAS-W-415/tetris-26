name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Build executable
        run: uv run pyinstaller tetris26.spec --noconfirm

      - name: Rename artifact per platform
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/tetris26.exe "out/tetris26-windows.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/tetris26 "out/tetris26-macos"
          else
            cp dist/tetris26 "out/tetris26-linux"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetris26-${{ runner.os }}
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
